name: Agromate CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: agromate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/agromate_test?schema=public"

      - name: Run Lint and Type Check
        run: |
          npm run lint --if-present
          npm run type-check --if-present

      - name: Run Vitest Test Suite
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/agromate_test?schema=public"
          NEXTAUTH_SECRET: "ci-test-secret-key-at-least-32-chars-long"
          NEXTAUTH_URL: "http://localhost:3000"
